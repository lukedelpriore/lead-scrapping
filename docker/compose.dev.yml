# Local development database. The app and worker run on the host with pnpm dev
# and pnpm worker. Section 14.
services:
  db:
    image: postgres:16
    container_name: dph_lead_engine_db
    environment:
      POSTGRES_USER: dph
      POSTGRES_PASSWORD: dph
      POSTGRES_DB: dph_lead_engine
    ports:
      - "5432:5432"
    volumes:
      - dph_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dph -d dph_lead_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dph_pgdata:

# Local stack. One command, Docker Desktop only, no Node, pnpm, or Postgres to
# install. By default it runs offline: provider keys are blank and REVEAL_MODE
# is off, so the free pipeline works against fixtures and nothing is charged.
#
#   docker compose -f docker/compose.local.yml up --build
#
# To run live with real results, copy docker/live.env.example to
# docker/live.env and fill in your keys (Serper for discovery, RocketReach for
# owner names and verified cells). docker/live.env is gitignored and is never
# committed or baked into the image. Then rebuild with the same command.
#
# Sign in with luke@delpriorehospitality.com and the password: leadengine
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dph
      POSTGRES_PASSWORD: dph
      POSTGRES_DB: dph_lead_engine
    volumes:
      - localpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dph -d dph_lead_engine"]
      interval: 5s
      timeout: 5s
      retries: 20

  setup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["sh", "-c", "pnpm --filter @dph/db migrate && pnpm --filter @dph/db seed"]
    # Non secret defaults. Secrets and toggles come from docker/live.env below.
    # Values here take precedence over live.env, so AI_MODE stays off.
    environment: &appenv
      DATABASE_URL: postgresql://dph:dph@db:5432/dph_lead_engine
      AUTH_SECRET: local-dev-secret-not-for-production-000000
      AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: luke@delpriorehospitality.com,hashir@delpriorehospitality.com
      SEED_PASSWORD: leadengine
      MAIL_FROM: "Del Priore Lead Engine <leads@delpriorehospitality.com>"
      AI_MODE: "off"
      LOG_LEVEL: info
      TZ: America/New_York
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment: *appenv
    # Optional live keys. Missing file is fine (stays offline).
    env_file:
      - path: ./live.env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["pnpm", "--filter", "@dph/worker", "start"]
    environment: *appenv
    env_file:
      - path: ./live.env
        required: false
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  localpgdata:
